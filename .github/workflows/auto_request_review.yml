---
name: "Auto Request Review"

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-request-review:
    name: Auto Request Review
    # Run only in the upstream repository. Downstream copies skip this job because these reviewers are upstream maintainers.
    if: github.repository == 'velero-io/velero-plugin-for-gcp'
    runs-on: ubuntu-latest
    steps:
      - name: Request a PR review based on files types/paths, and/or groups the author belongs to
        uses: necojackarc/auto-request-review@v0.13.0
        with:
          config: .github/auto-assignees.yml
